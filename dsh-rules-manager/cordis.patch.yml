# dsh-rules-manager 组合包（bundle）的配置层
# 按官方 bundle 规范（docs/develop/basic/publish.md）：插件行按包名引用，
# 由 Node 模块解析定位已安装的代码。本文件在 profile 把本包加入
# dsh.profile.bundles 后作为一层生效。
- insert:
    - id: rules-manager
      name: 'dsh-rules-manager'
    - id: rules-manager-service
      name: 'dsh-rules-manager/service.js'
    - id: rules-manager-client
      name: 'dsh-rules-manager-client'
